[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ggstyle"
version = "0.5.0"
description = "Publication finishing and safe date axes for Matplotlib"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Joshua Myers", email = "joshua.myers22@gmail.com" }]
keywords = ["matplotlib", "visualization", "dates", "ggplot2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.7.5",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/joshuamyers22/ggstyle"
Documentation = "https://joshuamyers22.github.io/ggstyle/"
Repository = "https://github.com/joshuamyers22/ggstyle"
Issues = "https://github.com/joshuamyers22/ggstyle/issues"
Changelog = "https://github.com/joshuamyers22/ggstyle/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# polars is a *test* dependency only. Frame support is duck-typed, so
# installing ggstyle never pulls polars in.
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "pandas-stubs",
    "polars>=1.0",
    "build",
    "twine",
    "typing-extensions",
]
polars = ["polars>=1.0"]
docs = ["sphinx>=7", "numpydoc>=1.6", "pydata-sphinx-theme>=0.15"]

[dependency-groups]
visual = [
    "matplotlib==3.11.1; python_version == '3.12'",
    "numpy==2.5.2; python_version == '3.12'",
    "pandas==3.0.5; python_version == '3.12'",
    "pillow==12.3.0; python_version == '3.12'",
    "pytest==9.1.1; python_version == '3.12'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ggstyle"]

[tool.hatch.build.targets.sdist]
include = [
    "/.github/constraints",
    "/src",
    "/tests",
    "/tools",
    "/examples",
    "/docs/architecture",
    "/docs/visual-regression.md",
    "/docs/source",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/REPRODUCIBILITY.md",
    "/SECURITY.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = ["visual: deterministic pixel comparisons in the pinned renderer job"]

[tool.coverage.run]
branch = true
source = ["ggstyle"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 92
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PERF", "PIE", "RET", "RUF", "SIM", "UP", "W"]

[tool.mypy]
files = ["src", "tests/typing"]
# Not strict yet: the matplotlib artist APIs this leans on are loosely typed.
# Tighten module by module rather than shipping a config that does not pass.
check_untyped_defs = true
warn_unused_configs = true
