name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q --cov=ggstyle --cov-report=term-missing
      - run: uv run ruff check .
      - run: uv run mypy src

  visual:
    runs-on: ubuntu-24.04
    env:
      GGSTYLE_RUN_VISUAL: "1"
      LANG: C
      LC_ALL: C
      MPLBACKEND: Agg
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group visual
      - run: uv run --frozen --group visual pytest -q tests/test_visual_regressions.py
      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-regression-diffs
          path: build/visual-results
          if-no-files-found: ignore
          retention-days: 14

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - run: uv build
      - run: uv run twine check dist/*

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - run: uv run python tools/validate_docstrings.py
      - run: uv run sphinx-build -W --keep-going -b html docs/source docs/build/html
      - run: MPLBACKEND=Agg uv run sphinx-build -W -b doctest docs/source docs/build/doctest
