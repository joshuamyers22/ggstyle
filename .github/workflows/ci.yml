name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q --cov=ggstyle --cov-report=term-missing
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python tools/finishing_usability.py

  platform:
    name: platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q

  dependencies:
    name: dependencies (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimum
            python-version: "3.10"
            constraints: .github/constraints/minimum.txt
          - profile: newest
            python-version: "3.13"
            constraints: .github/constraints/newest.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python-version }}
      - run: uv pip install --constraint ${{ matrix.constraints }} -e ".[dev]"
      - run: uv run --no-sync python tools/report_environment.py
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python tools/benchmark_registry.py

  prerelease:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.13
      - run: uv pip install --prerelease allow --upgrade -e ".[dev]"
      - run: uv run --no-sync python tools/report_environment.py
      - run: uv run --no-sync pytest -q

  visual:
    runs-on: ubuntu-24.04
    env:
      GGSTYLE_RUN_VISUAL: "1"
      LANG: C
      LC_ALL: C
      MPLBACKEND: Agg
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group visual
      - run: uv run --frozen --group visual pytest -q tests/test_visual_regressions.py
      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-regression-diffs
          path: build/visual-results
          if-no-files-found: ignore
          retention-days: 14

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - run: uv build
      - run: uv run twine check dist/*
      - name: Smoke-test the installed wheel
        run: >-
          uv run --isolated --no-project
          --with ./dist/ggstyle-*.whl
          python tools/smoke_wheel.py
      - name: Type-check against the installed wheel
        run: >-
          uv run --isolated --no-project
          --with ./dist/ggstyle-*.whl
          --with mypy --with pandas-stubs --with typing-extensions
          mypy --config-file pyproject.toml tests/typing
      - uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - run: uv run python tools/validate_docstrings.py
      - run: uv run sphinx-build -W --keep-going -b html docs/source docs/build/html
      - run: MPLBACKEND=Agg uv run sphinx-build -W -b doctest docs/source docs/build/doctest
