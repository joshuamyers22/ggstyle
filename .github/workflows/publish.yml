name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev,docs]"
      - name: Verify tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: python -c "import ggstyle, os; assert os.environ['TAG_NAME'] == 'v' + ggstyle.__version__"
      - run: python -m pytest -q --cov=ggstyle --cov-report=term-missing
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python tools/validate_docstrings.py
      - run: python -m sphinx -W --keep-going -b html docs/source docs/build/html
      - run: MPLBACKEND=Agg python -m sphinx -W -b doctest docs/source docs/build/doctest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ggstyle
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
